<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Pilot | Talent Stage Display</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ asset_url('css/receiver-common.css') }}">
    <link rel="stylesheet" href="{{ asset_url('css/talent.css') }}">
</head>
<body>

    <!-- Setup screen (also required to unlock the AudioContext in the browser) -->
    <div id="setup">
        <h2 style="color: #888; text-transform: uppercase; letter-spacing: 2px; margin-bottom: 30px;">Talent Stage Monitor</h2>
        <button class="btn-primary" onclick="enterStageMode()">Launch Display</button>
    </div>

    <div id="urgent-overlay"><h1 id="urgent-text">MESSAGE</h1></div>

    <div class="top-bar">
        <div class="master-timecode" id="master-timecode">00:00.0</div>
        <div class="real-time-clock" id="real-time-clock">00:00:00</div>
    </div>

    <div class="center-area">
        <div class="status-text" id="status-text">STANDBY</div>
        <div class="lyrics-text" id="lyrics-text">...</div>
    </div>

    <div class="bottom-bar">
        <div class="progress-container"><div class="progress-bar" id="progress-bar"></div></div>
        <div class="current-timer" id="current-timer">--</div>
    </div>

    <script src="{{ asset_url('js/receiver-common.js') }}"></script>
    <script src="{{ asset_url('js/talent.js') }}"></script>
</body>
</html>
