<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mini-Pilot | Camera Tally</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.0.1/socket.io.js"></script>
    <link rel="stylesheet" href="{{ asset_url('css/receiver-common.css') }}">
    <link rel="stylesheet" href="{{ asset_url('css/camera.css') }}">
</head>
<body>

    <!-- NETWORK OFFLINE ALARM -->
    <div id="offline-overlay"><h1>⚠️ OFFLINE</h1><p>Lost connection to Director Station.</p></div>

    <!-- INTERCOM ALERT -->
    <div id="urgent-overlay"><h1 id="urgent-text">MESSAGE</h1></div>

    <div id="flash-overlay"></div>
    <div id="dir-preview-badge">⚠️ PREVIEW — GET READY</div>

    <div id="setup">
        <h2 style="color: #888; text-transform: uppercase; letter-spacing: 2px;">Assign Camera</h2>
        <select id="my-camera">{% for scene in scenes %}<option value="{{ scene }}">{{ scene }}</option>{% endfor %}</select>
        <button class="btn-primary" onclick="enterCameraMode()">Start Tally</button>
    </div>

    <div id="viewfinder">
        <div class="top-bar">
            <div class="cam-badge" id="cam-badge">CAM: --</div>
            <div class="master-timecode" id="master-timecode">00:00.0</div>
            <div class="top-right-controls">
                <div class="real-time-clock" id="real-time-clock">00:00:00</div>
            </div>
        </div>

        <div class="center-area">
            <div class="status-text" id="status-text">STANDBY</div>
            <div class="main-timer" id="main-timer">--</div>
            <div class="lyrics-track" id="lyrics-track">🎶 <i>Waiting for script...</i></div>
            <div class="progress-container" id="progress-container"><div class="progress-bar" id="progress-bar"></div></div>

            <div class="metadata-box" id="metadata-box">
                <div class="shot-header">
                    <div><span class="shot-number" id="shot-number">SHOT #--</span><span class="shot-total" id="shot-total">/ --</span></div>
                    <div class="shot-movement" id="shot-movement">Static 🛑</div>
                </div>
                <div class="shot-note" id="shot-note"></div>
                <div class="next-action-box" id="next-action-box">
                    <div class="next-action-label">Next Action:</div>
                    <div class="next-action-details" id="next-action-details">--</div>
                </div>
            </div>
        </div>

        <div class="compact-footer" id="compact-footer">
            <div class="upcoming-label">UPCOMING:</div>
            <div class="upcoming-list" id="upcoming-list"><span style="color: #555; font-style: italic;">No upcoming shots</span></div>
        </div>
    </div>

    <script src="{{ asset_url('js/receiver-common.js') }}"></script>
    <script src="{{ asset_url('js/camera.js') }}"></script>
</body>
</html>
